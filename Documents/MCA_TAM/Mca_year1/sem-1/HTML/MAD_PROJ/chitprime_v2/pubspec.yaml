name: chitprime_v2
description: CHITPRIME - Smart Chit Fund App with Firebase
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Firebase
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.8
  cloud_firestore: ^4.15.8
  firebase_storage: ^11.6.9
  firebase_messaging: ^14.7.19
  firebase_database: ^10.4.9
  # State Management
  flutter_riverpod: ^2.4.9
  # Navigation
  go_router: ^13.0.0
  # UI
  google_fonts: ^6.1.0
  fl_chart: ^0.66.0
  percent_indicator: ^4.2.3
  shimmer: ^3.0.0
  badges: ^3.1.2
  confetti: ^0.7.0
  pin_code_fields: ^8.0.1
  lottie: ^3.1.0
  cached_network_image: ^3.3.1
  # Storage & Security
  flutter_secure_storage: ^9.0.0
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3
  # Utils
  intl: ^0.19.0
  uuid: ^4.3.3
  timeago: ^3.6.0
  connectivity_plus: ^5.0.2
  image_picker: ^1.0.7
  path_provider: ^2.1.2
  share_plus: ^7.2.1
  rxdart: ^0.27.7
  # Notifications
  flutter_local_notifications: ^17.0.0
  # PDF
  pdf: ^3.10.8
  open_file: ^3.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  assets:
    - assets/images/
