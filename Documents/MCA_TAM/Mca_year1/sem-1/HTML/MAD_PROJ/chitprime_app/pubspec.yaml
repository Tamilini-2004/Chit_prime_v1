name: chitprime
description: CHITPRIME - Smart Chit Fund App for Small Retailers
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  go_router: ^13.2.0
  google_fonts: ^6.2.1
  fl_chart: ^0.67.0
  intl: ^0.19.0
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.3
  cached_network_image: ^3.3.1
  image_picker: ^1.0.7
  pin_code_fields: ^8.0.1
  shimmer: ^3.0.0
  lottie: ^3.1.0
  percent_indicator: ^4.2.3
  flutter_svg: ^2.0.10+1
  badges: ^3.1.2
  timeago: ^3.6.1
  uuid: ^4.3.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^6.0.3
  local_auth: ^2.2.0
  flutter_local_notifications: ^17.1.2
